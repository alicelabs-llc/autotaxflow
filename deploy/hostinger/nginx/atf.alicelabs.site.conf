# /etc/nginx/sites-available/atf.alicelabs.site
#
# AutoTaxFlow web app — Next.js running on port 3000 inside Docker.
# nginx terminates TLS and reverse-proxies to the container.
#
# Install:
#   sudo cp deploy/hostinger/nginx/atf.alicelabs.site.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/atf.alicelabs.site.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d atf.alicelabs.site
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name atf.alicelabs.site www.atf.alicelabs.site;

    # Certbot will rewrite this to redirect to https on first run
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atf.alicelabs.site;

    # TLS certs — certbot will fill these in
    # ssl_certificate /etc/letsencrypt/live/atf.alicelabs.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/atf.alicelabs.site/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Body size limit for report uploads
    client_max_body_size 10m;

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # All other routes → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /api/* proxied to the API container (port 3001)
    # Only used if web app's next.config.js rewrites are bypassed (e.g. direct API calls)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
