# /etc/nginx/sites-available/api.atf.alicelabs.site
#
# AutoTaxFlow API — Fastify running on port 3001 inside Docker.
# Separate subdomain so CORS / cookie domains are clean.
#
# Install:
#   sudo cp deploy/hostinger/nginx/api.atf.alicelabs.site.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.atf.alicelabs.site.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.atf.alicelabs.site
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.atf.alicelabs.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.atf.alicelabs.site;

    # ssl_certificate /etc/letsencrypt/live/api.atf.alicelabs.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.atf.alicelabs.site/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Webhooks need larger bodies for big Shopify orders / Stripe payloads
    client_max_body_size 25m;

    # Webhooks need fast ack — no buffering, just forward
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # Billing webhook — idem
    location /api/billing/webhook {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # All other API routes
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check — no rate limit, no logging
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
        proxy_read_timeout 5s;
    }
}
